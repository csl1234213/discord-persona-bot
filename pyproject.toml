[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discord-persona-bot"
version = "0.1.0"
description = "Strict-evidence Discord persona language bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "discord.py>=2.5,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "bot"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app.services --cov=app.validators --cov=bot --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"

[tool.coverage.run]
data_file = ".cache/coverage/.coverage"
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", '\.\.\.']

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["ASYNC240"]
