name: discord-persona-bot

services:
  discord-persona-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-persona-bot:istoreos
    container_name: discord-persona-bot
    env_file:
      - .env
    environment:
      CHAT_DIRECT_UTTERANCE_MODE: "true"
      CHAT_RECENT_UTTERANCE_WINDOW: "3"
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
